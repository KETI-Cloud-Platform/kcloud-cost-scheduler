namespace: k8s-workload-operator-system
namePrefix: k8s-workload-operator-

resources:
- namespace.yaml
- ../crd
- ../rbac
- ../manager
- ../webhook
- ../certmanager
- metrics_service.yaml

patches:
- path: manager_metrics_patch.yaml
  target:
    kind: Deployment
    name: controller-manager
- path: manager_webhook_patch.yaml
  target:
    kind: Deployment
    name: controller-manager

replacements:
# Keep the cert-manager certificate DNS names aligned with the transformed
# Service name and namespace.
- source:
    kind: Service
    version: v1
    name: webhook-service
    fieldPath: metadata.name
  targets:
  - select:
      group: cert-manager.io
      version: v1
      kind: Certificate
      name: serving-cert
    fieldPaths:
    - spec.dnsNames.0
    - spec.dnsNames.1
    options:
      delimiter: .
      index: 0
- source:
    kind: Service
    version: v1
    name: webhook-service
    fieldPath: metadata.namespace
  targets:
  - select:
      group: cert-manager.io
      version: v1
      kind: Certificate
      name: serving-cert
    fieldPaths:
    - spec.dnsNames.0
    - spec.dnsNames.1
    options:
      delimiter: .
      index: 1

# Point both Admission configurations at the transformed Service.
- source:
    kind: Service
    version: v1
    name: webhook-service
    fieldPath: metadata.name
  targets:
  - select:
      group: admissionregistration.k8s.io
      version: v1
      kind: MutatingWebhookConfiguration
    fieldPaths:
    - webhooks.*.clientConfig.service.name
  - select:
      group: admissionregistration.k8s.io
      version: v1
      kind: ValidatingWebhookConfiguration
    fieldPaths:
    - webhooks.*.clientConfig.service.name
- source:
    kind: Service
    version: v1
    name: webhook-service
    fieldPath: metadata.namespace
  targets:
  - select:
      group: admissionregistration.k8s.io
      version: v1
      kind: MutatingWebhookConfiguration
    fieldPaths:
    - webhooks.*.clientConfig.service.namespace
  - select:
      group: admissionregistration.k8s.io
      version: v1
      kind: ValidatingWebhookConfiguration
    fieldPaths:
    - webhooks.*.clientConfig.service.namespace

# Keep CA injection annotations and the Certificate issuerRef valid after the
# common namespace/namePrefix transforms.
- source:
    group: cert-manager.io
    version: v1
    kind: Certificate
    name: serving-cert
    fieldPath: metadata.namespace
  targets:
  - select:
      group: admissionregistration.k8s.io
      version: v1
      kind: MutatingWebhookConfiguration
    fieldPaths:
    - metadata.annotations.[cert-manager.io/inject-ca-from]
    options:
      delimiter: /
      index: 0
  - select:
      group: admissionregistration.k8s.io
      version: v1
      kind: ValidatingWebhookConfiguration
    fieldPaths:
    - metadata.annotations.[cert-manager.io/inject-ca-from]
    options:
      delimiter: /
      index: 0
- source:
    group: cert-manager.io
    version: v1
    kind: Certificate
    name: serving-cert
    fieldPath: metadata.name
  targets:
  - select:
      group: admissionregistration.k8s.io
      version: v1
      kind: MutatingWebhookConfiguration
    fieldPaths:
    - metadata.annotations.[cert-manager.io/inject-ca-from]
    options:
      delimiter: /
      index: 1
  - select:
      group: admissionregistration.k8s.io
      version: v1
      kind: ValidatingWebhookConfiguration
    fieldPaths:
    - metadata.annotations.[cert-manager.io/inject-ca-from]
    options:
      delimiter: /
      index: 1
- source:
    group: cert-manager.io
    version: v1
    kind: Issuer
    name: selfsigned-issuer
    fieldPath: metadata.name
  targets:
  - select:
      group: cert-manager.io
      version: v1
      kind: Certificate
      name: serving-cert
    fieldPaths:
    - spec.issuerRef.name
